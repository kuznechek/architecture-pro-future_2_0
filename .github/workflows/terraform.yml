name: CI

on:
  push:
    branches:
      - feature
  pull_request:
    branches:
      - dev

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ENV: dev
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_token: ${{ secrets.YC_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: TaskAdvanced2/envs/${{ env.ENV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: |
          rm -rf .terraform .terraform.lock.hcl
          terraform init -reconfigure \
            -backend-config="key=TaskAdvanced2/${{ env.ENV }}/terraform.tfstate" \
            -backend-config="region=ru-central1"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: TaskAdvanced2/envs/${{ env.ENV }}/tfplan
          retention-days: 7

      - name: Terraform Apply
        if: github.ref_name == 'feature' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan